name: Test setup-go outputs

on: workflow_dispatch

jobs:
  outputs:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: mahabaleshwars/setup-go@feature/54-export-env-variables
        id: setup-go
        with:
          go-version: '1.25.5'

      - name: Print outputs
        shell: bash
        run: |
          echo "go-version:   ${{ steps.setup-go.outputs.go-version }}"
          echo "go-path:      ${{ steps.setup-go.outputs.go-path }}"
          echo "go-bin:       '${{ steps.setup-go.outputs.go-bin }}'"
          echo "go-bin-path:  ${{ steps.setup-go.outputs.go-bin-path }}"
          echo "go-root:      ${{ steps.setup-go.outputs.go-root }}"
          echo "go-cache:     ${{ steps.setup-go.outputs.go-cache }}"
          echo "go-mod-cache: ${{ steps.setup-go.outputs.go-mod-cache }}"

      - name: Verify against go env
        shell: bash
        run: |
          set -euo pipefail
          [ "$(go env GOPATH)"     = "${{ steps.setup-go.outputs.go-path }}" ]
          [ "$(go env GOROOT)"     = "${{ steps.setup-go.outputs.go-root }}" ]
          [ "$(go env GOCACHE)"    = "${{ steps.setup-go.outputs.go-cache }}" ]
          [ "$(go env GOMODCACHE)" = "${{ steps.setup-go.outputs.go-mod-cache }}" ]
          echo "outputs match go env"

      - name: Verify go-bin-path is usable
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/tools/cmd/stringer@latest
          ls "${{ steps.setup-go.outputs.go-bin-path }}/stringer"*
